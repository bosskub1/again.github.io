<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Script Hub</title>
    <style>
        /* สไตล์พื้นฐานโทนเข้ม (Dark Mode) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* กล่องสคริปต์ */
        .script-container {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #334155;
        }

        .script-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f1f5f9;
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* รายชื่อแมพที่ซัพพอร์ท */
        .supported-maps {
            margin-bottom: 20px;
        }

        .supported-maps h3 {
            color: #e2e8f0;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .badge {
            display: inline-block;
            background-color: #0369a1;
            color: #e0f2fe;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-right: 5px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        /* กล่องข้อความสำหรับก๊อปปี้สคริปต์ */
        .code-box {
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #34d399;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        /* ปุ่มกดก๊อปปี้ */
        .copy-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            font-size: 1rem;
        }

        .copy-btn:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Script Hub</h1>
    <p class="subtitle">แจกสคริปต์อัปเดตล่าสุด พร้อมรายชื่อแมพที่รองรับ</p>

    <div class="script-container">
        <div class="script-title">🚀 Super Cool Hub v1.0</div>
        
        <div class="supported-maps">
            <h3>🗺️ Supported Maps (แมพที่รองรับ):</h3>
            <span class="badge">Blox Fruits</span>
            <span class="badge">King Legacy</span>
            <span class="badge">BedWars</span>
        </div>

        <div class="code-box" id="scriptCode">loadstring(game:HttpGet("https://raw.githubusercontent.com/bosskub1/again.github.io/main/script.lua"))()</div>
        
        <button class="copy-btn" onclick="copyScript()">Copy Script</button>
    </div>

    <script>
        // ฟังก์ชันสำหรับกดก๊อปปี้สคริปต์อัตโนมัติ
        function copyScript() {
            const scriptText = document.getElementById("scriptCode").innerText;
            navigator.clipboard.writeText(scriptText).then(() => {
                alert("ก๊อปปี้สคริปต์เรียบร้อยแล้ว!");
            }).catch(err => {
                console.error('ไม่สามารถก๊อปปี้ได้: ', err);
            });
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGAIN HUB - Supported Games</title>
    <style>
        /* สไตล์ดาร์กโหมดสุดเท่ */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        /* การจัดวางการ์ดแมพที่ซัพพอร์ท */
        .maps-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 40px;
        }

        /* การ์ดแต่ละแมพ */
        .map-card {
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, border-color 0.2s;
        }

        .map-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }

        /* รูปภาพแมพ */
        .map-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #0f172a; /* สีพื้นหลังระหว่างรอรูปโหลด */
        }

        /* ชื่อแมพด้านล่างรูป */
        .map-name {
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            color: #f1f5f9;
        }

        /* กล่องสคริปต์หลัก */
        .script-section {
            background-color: #111827;
            border-radius: 14px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .script-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #f1f5f9;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .code-box {
            background-color: #030712;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.95rem;
            color: #34d399;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            max-height: 120px;
            overflow-y: auto;
        }

        /* ปุ่มกดก๊อปปี้ */
        .copy-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1.05rem;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: linear-gradient(135deg, #7dd3fc 0%, #0369a1 100%);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <h1>AGAIN HUB</h1>
    <p class="subtitle">🚀 รายชื่อแมพที่รองรับและตัวรันสคริปต์หลัก</p>

    <div class="maps-container">
        
        <div class="map-card">
            <img class="map-img" src="https://cdn.discordapp.com/attachments/1507664883364270170/1507664989639671908/image.png?ex=6a12b9f0&is=6a116870&hm=673ed2153e58a481ffa283c4b16e9eab5dc78b40664b95f472b3f9cf06f667d1" alt="Game 1">
            <div class="map-name">🏜️ Arcane Lineage</div>
        </div>

        <div class="map-card">
            <img class="map-img" src="https://via.placeholder.com/400x200" alt="Game 2">
            <div class="map-name">Grand Piece Online</div>
        </div>

        <div class="map-card">
            <img class="map-img" src="https://via.placeholder.com/400x200" alt="Game 3">
            <div class="map-name">Attack on Titan Revolution</div>
        </div>

    </div>

    <div class="script-section">
        <div class="script-title">⭐ Main Script Loader</div>
        <div class="code-box" id="scriptCode">loadstring(game:HttpGet("https://raw.githubusercontent.com/bosskub1/again.github.io/main/script.lua"))()</div>
        <button class="copy-btn" onclick="copyScript()">Copy Script</button>
    </div>

    <script>
        function copyScript() {
            const scriptText = document.getElementById("scriptCode").innerText;
            navigator.clipboard.writeText(scriptText).then(() => {
                alert("ก๊อปปี้สคริปต์เรียบร้อยแล้ว!");
            }).catch(err => {
                console.error('ไม่สามารถก๊อปปี้ได้: ', err);
            });
        }
    </script>

</body>
</html>
